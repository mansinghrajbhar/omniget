name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Rust Android linker
        run: cargo install cargo-ndk --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Tauri Android project
        run: pnpm tauri android init

      - name: Create Android-only Rust entry point
        shell: bash
        run: |
          set -euo pipefail
          mv src-tauri/src/lib.rs src-tauri/src/lib_desktop.rs
          cat > src-tauri/src/lib.rs <<'EOF'
          #[cfg(not(target_os = "android"))]
          include!("lib_desktop.rs");

          #[cfg(target_os = "android")]
          mod mobile;

          #[cfg(target_os = "android")]
          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {
              tauri::Builder::default()
                  .plugin(tauri_plugin_dialog::init())
                  .plugin(tauri_plugin_notification::init())
                  .plugin(tauri_plugin_fs::init())
                  .invoke_handler(tauri::generate_handler![
                      mobile::detect_platform,
                      mobile::download_from_url,
                  ])
                  .run(tauri::generate_context!())
                  .expect("error while running Android application");
          }
          EOF

      - name: Select mobile Rust feature set
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src-tauri/Cargo.toml")
          s = p.read_text()
          old = 'omniget-core = { path = "omniget-core", features = ["desktop"] }'
          new = 'omniget-core = { path = "omniget-core", default-features = false, features = ["mobile"] }'
          if old not in s:
              raise SystemExit("Expected omniget-core dependency declaration was not found")
          p.write_text(s.replace(old, new))
          PY

      - name: Select mobile Rust TLS dependencies
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          # The Android-only entry point doesn't use desktop torrent/P2P or
          # dynamic plugin loading. Remove these optional desktop dependencies
          # from this temporary Android build manifest.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Cargo.toml")
          s = p.read_text()
          for old, new in [
              ('librqbit = "8.1.1"', 'librqbit = { version = "8.1.1", optional = true }'),
              ('discord-rich-presence = "0.2"', 'discord-rich-presence = { version = "0.2", optional = true }'),
              ('keepawake = "0.5"', 'keepawake = { version = "0.5", optional = true }'),
              ('libloading = "0.8"', 'libloading = { version = "0.8", optional = true }'),
          ]:
              s = s.replace(old, new)
          p.write_text(s)
          PY
          # The android entry point avoids compiling the desktop Tauri module;
          # verify whether OpenSSL is still present and show the dependency path.
          cargo tree --target aarch64-linux-android -i openssl-sys || true

      - name: Build frontend
        run: pnpm build

      - name: Build Android APK
        run: pnpm tauri android build --apk

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -print
          apk="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' | grep -E '(universal|release)' | head -n 1 || true)"
          if [ -z "$apk" ]; then
            apk="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' | head -n 1 || true)"
          fi
          if [ -z "$apk" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi
          cp "$apk" artifacts/omniget-android.apk
          ls -lh artifacts/omniget-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniget-android-apk
          path: artifacts/omniget-android.apk
          if-no-files-found: error
          retention-days: 14
