name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Rust Android linker
        run: cargo install cargo-ndk --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Tauri Android project
        run: pnpm tauri android init

      - name: Create Android-only Rust entry point
        shell: bash
        run: |
          set -euo pipefail
          mv src-tauri/src/lib.rs src-tauri/src/lib_desktop.rs
          cat > src-tauri/src/lib.rs <<'EOF'
          #[cfg(not(target_os = "android"))]
          include!("lib_desktop.rs");

          #[cfg(target_os = "android")]
          mod mobile;

          #[cfg(target_os = "android")]
          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {
              tauri::Builder::default()
                  .plugin(tauri_plugin_dialog::init())
                  .plugin(tauri_plugin_notification::init())
                  .plugin(tauri_plugin_fs::init())
                  .invoke_handler(tauri::generate_handler![
                      mobile::detect_platform,
                      mobile::download_from_url,
                  ])
                  .run(tauri::generate_context!())
                  .expect("error while running Android application");
          }
          EOF

      - name: Select mobile Rust feature set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src-tauri/Cargo.toml")
          s = p.read_text()
          old = 'omniget-core = { path = "omniget-core", features = ["desktop"] }'
          new = 'omniget-core = { path = "omniget-core", default-features = false, features = ["mobile"] }'
          if old not in s:
              raise SystemExit("Expected omniget-core dependency declaration was not found")
          p.write_text(s.replace(old, new))
          PY

      - name: Select mobile-only dependencies
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Cargo.toml")
          s = p.read_text()
          for old, new in [
              ('libloading = "0.8"', 'libloading = { version = "0.8", optional = true }'),
              ('librqbit = "8.1.1"', 'librqbit = { version = "8.1.1", optional = true }'),
              ('keepawake = "0.5"', 'keepawake = { version = "0.5", optional = true }'),
              ('discord-rich-presence = "0.2"', 'discord-rich-presence = { version = "0.2", optional = true }'),
          ]:
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Add Android yt-dlp runtime
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="src-tauri/gen/android/app"
          GRADLE="$APP_DIR/build.gradle.kts"
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"
          if [ ! -f "$GRADLE" ]; then
            echo "ERROR: Android app Gradle file not found: $GRADLE"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          p = Path("src-tauri/gen/android/app/build.gradle.kts")
          s = p.read_text()
          deps = [
              'implementation("dev.ffmpegkit-maintained:yt-dlp-android:2.0.2")',
              'implementation("dev.ffmpegkit-maintained:yt-dlp-android-compat:2.0.2")',
          ]
          marker = "dependencies {"
          if marker not in s:
              raise SystemExit("dependencies block not found in Android Gradle file")
          insert = "\n".join("    " + d for d in deps if d not in s)
          if insert:
              s = s.replace(marker, marker + "\n" + insert, 1)
          p.write_text(s)

          m = Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          ms = m.read_text()
          if 'android:extractNativeLibs="true"' not in ms:
              ms = ms.replace('<application ', '<application android:extractNativeLibs="true" ', 1)
          if 'android.permission.INTERNET' not in ms:
              idx = ms.find('>\n', ms.find('<manifest'))
              if idx == -1:
                  raise SystemExit("manifest root tag not found")
              ms = ms[:idx+2] + '    <uses-permission android:name="android.permission.INTERNET" />\n' + ms[idx+2:]
          m.write_text(ms)
          PY

          PKG=$(grep -Rhm1 '^package ' "$APP_DIR/src/main/java" | sed 's/^package //' | tr -d '\r' | xargs)
          if [ -z "$PKG" ]; then
            echo "ERROR: Could not determine Android package"
            exit 1
          fi
          PKG_PATH="${PKG//./\/}"
          JAVA_DIR="$APP_DIR/src/main/java/$PKG_PATH"
          mkdir -p "$JAVA_DIR"

          cat > "$JAVA_DIR/OmniYtDlpBridge.kt" <<'EOF'
          package __PACKAGE__

          import android.app.Activity
          import android.content.ContentValues
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import dev.ffmpegkit_maintained.ytdlp.compat.YoutubeDL
          import dev.ffmpegkit_maintained.ytdlp.compat.YoutubeDLException
          import dev.ffmpegkit_maintained.ytdlp.compat.YoutubeDLRequest
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.util.concurrent.Executors

          class OmniYtDlpBridge(
              private val activity: Activity,
              private val webView: WebView,
          ) {
              private val executor = Executors.newCachedThreadPool()
              @Volatile private var ready = false

              init {
                  try {
                      YoutubeDL.getInstance().init(activity)
                      ready = true
                  } catch (_: YoutubeDLException) {
                      ready = false
                  }
              }

              @JavascriptInterface
              fun isReady(): Boolean = ready

              @JavascriptInterface
              fun download(url: String, mode: String, quality: String): String {
                  if (!ready) return "error:yt-dlp runtime initialization failed"
                  if (url.isBlank()) return "error:empty url"
                  executor.execute {
                      val root = activity.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS) ?: activity.filesDir
                      val outDir = File(root, "OmniGet")
                      outDir.mkdirs()
                      val before = outDir.listFiles()?.map { it.absolutePath }?.toSet() ?: emptySet()
                      val template = File(outDir, "%(title)s.%(ext)s").absolutePath
                      try {
                          val request = YoutubeDLRequest(url)
                          request.addOption("-o", template)
                          request.addOption("--no-mtime")
                          request.addOption("--newline")
                          request.addOption("--no-playlist")
                          if (mode == "audio") {
                              request.addOption("-f", "bestaudio/best")
                          } else {
                              val q = if (quality.isBlank() || quality == "best") "1080" else quality
                              request.addOption("-f", "best[height<=$q]/best")
                          }
                          YoutubeDL.getInstance().execute(request) { progress, eta ->
                              val js = "window.__omnigetAndroidProgress && window.__omnigetAndroidProgress(${progress.toInt()}, ${eta});"
                              activity.runOnUiThread { webView.evaluateJavascript(js, null) }
                          }
                          val files = outDir.listFiles()?.filter { it.isFile && !before.contains(it.absolutePath) } ?: emptyList()
                          files.forEach { publishToDownloads(it) }
                          val name = files.firstOrNull()?.name ?: ""
                          val safe = name.replace("\\", "\\\\").replace("'", "\\'")
                          activity.runOnUiThread { webView.evaluateJavascript("window.__omnigetAndroidFinished && window.__omnigetAndroidFinished('$safe');", null) }
                      } catch (t: Throwable) {
                          val safe = (t.message ?: t.javaClass.simpleName).replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ")
                          activity.runOnUiThread { webView.evaluateJavascript("window.__omnigetAndroidError && window.__omnigetAndroidError('$safe');", null) }
                      }
                  }
                  return "started"
              }

              private fun publishToDownloads(source: File) {
                  if (!source.exists()) return
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val mime = when (source.extension.lowercase()) {
                          "mp4" -> "video/mp4"
                          "webm" -> "video/webm"
                          "mkv" -> "video/x-matroska"
                          "mp3" -> "audio/mpeg"
                          "m4a" -> "audio/mp4"
                          "opus" -> "audio/ogg"
                          else -> "application/octet-stream"
                      }
                      val values = ContentValues().apply {
                          put(MediaStore.Downloads.DISPLAY_NAME, source.name)
                          put(MediaStore.Downloads.MIME_TYPE, mime)
                          put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/OmniGet")
                          put(MediaStore.Downloads.IS_PENDING, 1)
                      }
                      val uri = activity.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values) ?: return
                      try {
                          activity.contentResolver.openOutputStream(uri)?.use { output -> FileInputStream(source).use { input -> input.copyTo(output) } }
                          values.clear()
                          values.put(MediaStore.Downloads.IS_PENDING, 0)
                          activity.contentResolver.update(uri, values, null, null)
                          source.delete()
                      } catch (_: Throwable) {
                          activity.contentResolver.delete(uri, null, null)
                      }
                  } else {
                      val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "OmniGet")
                      dir.mkdirs()
                      val target = File(dir, source.name)
                      FileInputStream(source).use { input -> FileOutputStream(target).use { output -> input.copyTo(output) } }
                      source.delete()
                  }
              }
          }
          EOF
          sed -i "s/__PACKAGE__/$PKG/g" "$JAVA_DIR/OmniYtDlpBridge.kt"

          MAIN="$JAVA_DIR/MainActivity.kt"
          if [ ! -f "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found at $MAIN"
            exit 1
          fi
          cat > "$MAIN" <<EOF
          package $PKG

          import android.webkit.WebView

          class MainActivity : TauriActivity() {
              override fun onWebViewCreate(webView: WebView) {
                  super.onWebViewCreate(webView)
                  webView.addJavascriptInterface(OmniYtDlpBridge(this, webView), "omnigetYtDlp")
              }
          }
          EOF

      - name: Mark Android yt-dlp as embedded and route Android downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src-tauri/src/commands/dependencies.rs")
          s = p.read_text()
          old = '''    let (ytdlp_version, ffmpeg_version) = tokio::join!(
        dependencies::check_version("yt-dlp"),
        dependencies::check_version("ffmpeg"),
    );'''
          new = '''    #[cfg(target_os = "android")]
    let ytdlp_version = Some("embedded-android".to_string());
    #[cfg(not(target_os = "android"))]
    let ytdlp_version = dependencies::check_version("yt-dlp").await;

    let ffmpeg_version = dependencies::check_version("ffmpeg").await;'''
          if old not in s:
              raise SystemExit("check_dependencies block not found")
          p.write_text(s.replace(old, new, 1))

          p = Path("src-tauri/src/mobile.rs")
          s = p.read_text()
          s = s.replace('supported: platform_downloader(&platform).is_some(),', 'supported: true,', 1)
          p.write_text(s)

          p = Path("src/routes/+page.svelte")
          s = p.read_text()
          needle = '''    const platform = info.platform;
    omniState = { kind: "preparing", platform };'''
          replacement = '''    const platform = info.platform;

    const androidYtDlp = (window as any).omnigetYtDlp;
    if (androidYtDlp?.isReady?.() && platform !== "p2p") {
      const currentUrlForAndroid = url.trim();
      omniState = { kind: "preparing", platform };
      url = "";
      const result = androidYtDlp.download(currentUrlForAndroid, downloadMode, selectedQuality);
      if (typeof result === "string" && result.startsWith("error:")) {
        omniState = { kind: "error", message: result.slice(6), originalUrl: currentUrlForAndroid, platform };
      } else {
        showToast("info", "Android download started");
        omniState = { kind: "idle" };
      }
      return;
    }

    omniState = { kind: "preparing", platform };'''
          if needle not in s:
              raise SystemExit("download action insertion point not found")
          p.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Build frontend
        run: pnpm build

      - name: Build signed Android debug APK
        run: pnpm tauri android build --debug --apk

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          outputs="src-tauri/gen/android/app/build/outputs"
          apk="$(find "$outputs" -type f -name '*.apk' -path '*/debug/*' | grep -E '/(arm64-v8a|universal)/' | head -n 1 || true)"
          if [ -z "$apk" ]; then
            apk="$(find "$outputs" -type f -name '*.apk' -path '*/debug/*' | head -n 1 || true)"
          fi
          if [ -z "$apk" ]; then
            echo "ERROR: Signed debug APK was not produced."
            find "$outputs" -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "APK=$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" | tee /tmp/omniget-badging.txt
          grep -q "package: name='wtf.tonho.omniget'" /tmp/omniget-badging.txt
          mkdir -p artifacts
          cp "$apk" artifacts/omniget-android-debug.apk
          ls -lh artifacts/omniget-android-debug.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniget-android-apk-installable
          path: artifacts/omniget-android-debug.apk
          if-no-files-found: error
          retention-days: 30